{% set xorg_name = "xf86vidmodeproto" %}
{% set xorg_category = "proto" %}
{% set name = "xorg-" ~ xorg_name %}
{% set version = "2.3.1" %}
{% set sha256 = "45d9499aa7b73203fd6b3505b0259624afed5c16b941bd04fcf123e5de698770" %}
{% set am_version = "1.16" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.bz2
  url: https://www.x.org/releases/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.bz2
  sha256: {{ sha256 }}
  patches:
    - 0001-update-config-guess.patch

build:
  number: 1005
  ignore_run_exports_from:                # [win and arm64]
    - {{ m2w64_c_compiler }}_win-64       # [win and arm64]
    - {{ m2w64_c_stdlib }}_win-64         # [win and arm64]

requirements:
  build:
    - m2-autoconf                  # [win]
    - m2-automake{{ am_version }}  # [win]
    - m2-libtool                   # [win]
    - pkg-config                   # [unix]
    - m2-pkg-config                # [win]
    - gnuconfig                    # [unix]
    - m2-base                      # [win]
    - make                         # [unix]
    - m2-make                      # [win]
    - {{ stdlib("c") }}            # [unix]
    - {{ compiler("c") }}          # [unix]
    - {{ stdlib("m2w64_c") }}      # [win and x86_64]
    - {{ compiler("m2w64_c") }}    # [win and x86_64]
    # Headers only: on win-arm64 the x86-64 MinGW compiler only runs configure's checks.
    - {{ m2w64_c_stdlib }}_win-64 {{ m2w64_c_stdlib_version }}.*        # [win and arm64]
    - {{ m2w64_c_compiler }}_win-64 {{ m2w64_c_compiler_version }}.*    # [win and arm64]
    - autoconf                     # [unix]
    - automake                     # [unix]
    - gettext                      # [unix]
    - libtool                      # [unix]
  host:
    - xorg-util-macros

test:
  commands:
    - test -e $PREFIX/include/X11/extensions/xf86vmproto.h  # [not win]

about:
  home: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: 'Print extension headers'

extra:
  recipe-maintainers:
    - epruesse
    - pkgw
    - ehfd
